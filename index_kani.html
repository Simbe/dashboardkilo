    'Kani muistuttaa: kiitos on taikasana. ✨',
    'Anteeksi on myös taikasana, sanoo kani.',
    'Pienikin pomppu vie eteenpäin.',
    'Virheistä oppii. Kanikin kompastuu joskus.',
    'Jos jännittää, hengitä syvään. Kani tekee niin.',
    'Hyvä uni tekee kanista iloisen. 😴',
    'Siivotaanko yhdessä? Kani auttaa!',
    'Kani auttaisi tiskeissä, mutta tassut kastuvat.',
    'Kani unohti, mitä piti sanoa. Pomppis!',
    'Kani vaihtoi kampausta. Huomasitko?',
    'Kani on salaa supersankari.',
    'Superkani tulee apuun!',
    'Kani kävi Kilon asemalla katsomassa junia. 🚆',
    'Kani odottaa bussia. Kohta se tulee! 🚌',
    'Kani tarkistaa aina lähtöajat. Fiksu kani!',
    'Kani tietää: ajoissa lähtenyt ehtii junaan.',
    'Mitä kivaa tänään tapahtui? Kani haluaa kuulla!',
    'Kerro kanille jotain kivaa!',
    'Kani kuuntelee aina. 🐰',
    'Kani on täällä. Aina. 💛',
    'Kanin taikasana tänään: pörröinen!',
    'Kani pomppii iloisena, koska sinä olet siinä.',
    'Kaikki kanit ovat erityisiä. Varsinkin sinä!'
  ];
  var kaniBag = [], lastLine = -1, bubbleTimer = null;

  function kaniLine(){
    var p = kaniNow(), s = kaniState, special = [];
    if (isKaniNight(p)) special.push('Zzz… kani nukkuu jo.');
    if ((s.feels !== null ? s.feels : s.temp) !== null && (s.feels !== null ? s.feels : s.temp) <= -5) special.push('Brr! Kanin korvat jäätyy.');
    if (/^(rain|drizzle|thunder|sleet)$/.test(s.kind)) special.push('Sateenvarjo mukaan, kani muistuttaa! ☔');
    if (s.kind === 'snow') special.push('Lunta! Kani rakentaa lumikanin. ⛄');
    if (s.kind === 'clear-day' && s.temp >= 15) special.push('Aurinkolasit päähän! 😎');
    if (isBirthday(p)) special.push('Onnea päivänsankarille! 🎉');
    if (flagDay()) special.push('Tänään liputetaan: ' + flagDay() + '!');
    if (!isKaniNight(p) && clothingTip()) special.push(clothingTip());
    if (isPracticeDay(p) || isGameDay(p)) special.push('Muista luistimet ja maila! ⛸️');
    // weather / night / birthday lines now and then; otherwise the 100 everyday lines
    if (special.length && Math.random() < 0.25) return special[Math.floor(Math.random() * special.length)];
    // shuffle bag: every line once, in random order, before any repeats
    if (!kaniBag.length){
      for (var i = 0; i < KANI_LINES.length; i++) kaniBag.push(i);
      for (var j = kaniBag.length - 1; j > 0; j--){
        var r = Math.floor(Math.random() * (j + 1)), tmp = kaniBag[j]; kaniBag[j] = kaniBag[r]; kaniBag[r] = tmp;
      }
      if (kaniBag.length > 1 && kaniBag[kaniBag.length - 1] === lastLine) kaniBag.unshift(kaniBag.pop());
    }
    lastLine = kaniBag.pop();
    return KANI_LINES[lastLine];
  }

  function kaniSay(){ kaniShow(kaniLine()); }
  function kaniShow(text, ms){
    var bunny = document.getElementById('kani'), bubble = document.getElementById('kaniBubble');
    if (!bunny || !bubble) return;
    bubble.textContent = text;
    bubble.className = 'kani-bubble';                 // measure while hidden
    // To the right of the bunny, inside the weather panel: it may cover the
    // stats for a moment, but never the date and clock above.
    var r = bunny.getBoundingClientRect();
    var panel = bunny.closest('.current-panel').getBoundingClientRect();
    var left = r.left + r.width * 0.62;
    bubble.style.maxWidth = Math.max(160, panel.right - 10 - left) + 'px';
    var h = bubble.offsetHeight;
    var top = r.top + r.height * 0.12;
    top = Math.max(panel.top + 8, Math.min(top, panel.bottom - 8 - h));   // a very long text may hang below, never above
    bubble.style.left = left + 'px';
    bubble.style.top = top + 'px';
    bubble.className = 'kani-bubble show';
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubble.className = 'kani-bubble'; }, ms || 4500);
  }

  /* ---- tap the clock 5 times in a row: carrot and bunny rain ---- */
  var clockTaps = [];
  function kaniRain(){
    if (document.querySelector('.kani-rain')) return;
    var p = kaniNow();
    var set = isBirthday(p) ? ['🎈', '🎂', '🎉', '🐰']
      : isEaster(p) ? ['🥚', '🐣', '🐰']
      : (p.m === 12 ? ['🥕', '🐰', '🎄'] : ['🥕', '🐰']);
    var box = document.createElement('div');
    box.className = 'kani-rain';
    box.setAttribute('aria-hidden', 'true');
    var count = 32;   // runs even with "reduce animations": it only happens when asked for
    for (var i = 0; i < count; i++){
      var s = document.createElement('span');
      s.textContent = set[i % set.length];
      s.style.left = (Math.random() * 94).toFixed(1) + '%';
      s.style.fontSize = 'calc(var(--u) * ' + (2.4 + Math.random() * 2.8).toFixed(1) + ')';
      s.style.animationDelay = (Math.random() * 1.8).toFixed(2) + 's';
      s.style.animationDuration = (2.6 + Math.random() * 1.8).toFixed(2) + 's';
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 7000);
  }

  /* ---- tap the date (top left) 5 times in a row: a giant trembling bunny ---- */
  var dateTaps = [];
  function kaniGiant(){
    if (document.querySelector('.kani-giant')) return;
    var box = document.createElement('div');
    box.className = 'kani-giant';
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<div class="kani-giant__sayrow"><div class="kani-giant__say">Mä ihan tärisen!</div></div>' +
      '<div class="kani-giant__hop"><div class="kani-giant__shake">' + KANI_SVG + '</div></div>';
    document.body.appendChild(box);
    var gone = false;
    function leave(){
      if (gone) return;
      gone = true;
      box.className = 'kani-giant is-leaving';
      setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 500);
    }
    setTimeout(leave, 6000);   // taps don't close it: an extra 6th tap mustn't cut it short
  }

  /* ---- now and then, a bunny hops across the bottom of the screen ---- */
  function kaniHop(){
    if (REDUCED_MOTION || document.querySelector('.kani-hop')) return;
    var hop = document.createElement('div');
    hop.className = 'kani-hop';
    hop.setAttribute('aria-hidden', 'true');
    hop.innerHTML = '<div class="kani-hop__body">' + KANI_SVG + '</div>';
    document.body.appendChild(hop);
    setTimeout(function(){ if (hop.parentNode) hop.parentNode.removeChild(hop); }, 9500);
  }
  function scheduleHop(){
    var wait = (40 + Math.random() * 40) * 60 * 1000;   // every 40-80 minutes
    setTimeout(function(){
      var p = kaniNow();
      if (p.h >= 7 && p.h < 21 && document.visibilityState !== 'hidden') kaniHop();
      scheduleHop();
    }, wait);
  }

  (function initKani(){
    var holder = document.getElementById('kani');
    if (holder) holder.innerHTML = KANI_SVG;
    var temp = document.getElementById('curTemp');
    // pointerup fires once per tap for mouse, finger and pen alike; "click" can
    // be swallowed when a browser treats quick taps as a double-tap zoom.
    if (temp) temp.addEventListener('pointerup', kaniSay);
    // tap the bunny: it says something; hold it for a second: version number
    var pressTimer = null, pressed = false;
    if (holder) {
      holder.addEventListener('pointerdown', function(){
        pressed = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(function(){ pressed = true; kaniShow('Kilon kotinäyttö · versio ' + VERSION, 6000); }, 800);
      });
      holder.addEventListener('pointerup', function(){
        clearTimeout(pressTimer);
        if (pressed) { pressed = false; return; }
        kaniSay();
      });
      holder.addEventListener('pointercancel', function(){ clearTimeout(pressTimer); });
      holder.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    }
    var clock = document.getElementById('clockTime');
    if (clock) clock.addEventListener('pointerup', function(){
      var now = Date.now();
      if (clockTaps.length && now - clockTaps[clockTaps.length - 1] > 1500) clockTaps = [];
      clockTaps.push(now);
      if (clockTaps.length >= 5) { clockTaps = []; kaniRain(); }
    });
    var date = document.getElementById('clockDate');
    if (date) date.addEventListener('pointerup', function(){
      var now = Date.now();
      if (dateTaps.length && now - dateTaps[dateTaps.length - 1] > 1500) dateTaps = [];
      dateTaps.push(now);
      if (dateTaps.length >= 5) { dateTaps = []; kaniGiant(); }
    });
    updateKani();
    fitKani();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitKani);
    window.addEventListener('resize', fitKani);
    setInterval(updateKani, 60 * 1000);
    setInterval(autoTip, 60 * 1000);
    scheduleHop();
  })();

})();
</script>
</body>
</html>
