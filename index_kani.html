<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1220">
<title>Kilon kotinäyttö</title>
<link rel="icon" href="data:,"><!-- no favicon; stops the 404 in the console -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* PORTRAIT version for a 3:4 tablet (Galaxy Tab S2 in Fully Kiosk).
     Everything is sized from --u (1 u = 10.24 px at 768x1024), so the
     dashboard fills the screen exactly and scales evenly on other sizes. */
  :root{
    --bg:#0B1220;
    --panel:#111B2E;
    --panel-edge:#1C2A45;
    --border:#223050;
    --text:#EAF2FF;
    --muted:#93A6C8;
    --muted-dim:#7D91B4;   /* 5.4:1 on the panels, readable from across the room */
    --amber:#F4A94A;
    --teal:#4FD1C5;
    --red:#E8646B;
    --green:#5BD18B;
    /* type scale: every text on the page uses one of these
       (17 / 19 / 22 / 25 / 29 / 39 / 64 / 90 px on the 768 x 1024 tablet) */
    --fs-xs: calc(var(--u) * 1.66);
    --fs-s:  calc(var(--u) * 1.86);
    --fs-m:  calc(var(--u) * 2.15);
    --fs-l:  calc(var(--u) * 2.44);
    --fs-xl: calc(var(--u) * 2.83);
    --u: min(1.3333vw, 1vh);
    --gap: calc(var(--u) * 1.1);
    --radius: calc(var(--u) * 1.6);
    --num: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  .dash {
    --row-h: calc(var(--u) * 3.85);  /* one departure row */
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    height: 100vh;
    width: 100vw;
    padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6) calc(var(--u) * 0.6);
    background:
      radial-gradient(ellipse at 15% 0%, rgba(79,209,197,0.07), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(244,169,74,0.05), transparent 55%),
      var(--bg);
  }
  .dash > * { position: relative; z-index: 1; }
  .dash { transition: transform 1s ease; }   /* burn-in guard: see pixelShift() */

  .tint-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    transition: opacity 3s ease;
  }
  #nightTint {
    background: radial-gradient(ellipse at 50% -10%, rgba(20,30,60,0.9), rgba(6,9,20,0.55) 70%);
    opacity: 0;
  }
  #duskTint {
    background: radial-gradient(ellipse at 15% 0%, rgba(244,169,74,0.22), transparent 60%);
    opacity: 0;
  }

  /* numbers: same face everywhere, digits that don't jiggle as they change */
  .num { font-family: var(--num); }
  .tnum { font-variant-numeric: tabular-nums; }

  /* WEATHER ICONS (inline SVG, duotone) */
  .wi {
    display: block;
    width: 1em;
    height: 1em;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .wi-cloud { stroke: #AFC0DC; }
  .wi-knock { fill: var(--panel); }
  .wi-sun   { stroke: var(--amber); }
  .wi-moon  { stroke: #C9D6EF; }
  .wi-rain  { stroke: var(--teal); }
  .wi-snow  { stroke: #DCE8FA; stroke-width: 2.6; }
  .wi-flake { stroke-width: 1.7; }
  .wi-fog   { stroke: #8FA3C4; }
  .wi-bolt  { stroke: var(--amber); }

  /* HEADER: date on the left, clock on the right */
  .dash__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 calc(var(--u) * 0.3) calc(var(--u) * 0.9);
    border-bottom: 1px solid var(--border);
  }
  .clock__date {
    font-size: calc(var(--u) * 3.8);
    line-height: 1;
    letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .clock__weekday { color: var(--text); font-weight: 600; }
  .clock__daymonth { color: var(--muted); font-weight: 500; }
  .clock__time {
    font-size: calc(var(--u) * 6.25);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  /* TRAIN NOTICE (track works etc.): its own row above the departures, only when active */
  .train-notice {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    gap: calc(var(--u) * 1);
    background: var(--panel);
    border: 1px solid rgba(244,169,74,0.45);
    border-left: 3px solid var(--amber);
    border-radius: var(--radius);
    padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  }
  .train-notice[hidden] { display: none; }
  .train-notice__icon { font-size: calc(var(--u) * 2.4); color: var(--amber); flex: 0 0 auto; margin-top: 0.05em; }
  .train-notice__icon .wi { stroke: currentColor; }
  .train-notice__text {
    font-size: var(--fs-s);
    line-height: 1.3;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .train-notice__more { color: var(--muted); margin-left: 0.4em; }

  /* CURRENT CONDITIONS */
  .current-panel {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: calc(var(--u) * 2.2);
    align-items: center;
    padding: calc(var(--u) * 1.2) calc(var(--u) * 2.2) calc(var(--u) * 1.3);
  }
  /* left side: temperature, condition and feels-like on the left, the bunny
     standing next to all three on the right */
  .current__main {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: calc(var(--u) * 1.2);
    align-items: center;
  }
  .current__top, .current__cond, .current__feels { grid-column: 1; }
  .current__top {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 1.2);
  }
  .current__icon { font-size: calc(var(--u) * 6.6); line-height: 1; flex: 0 0 auto; }
  .current__temp {
    font-size: calc(var(--u) * 8.8);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }
  .current__cond {
    font-size: var(--fs-l);
    font-weight: 600;
    line-height: 1.15;
    margin-top: calc(var(--u) * 0.45);
  }
  .current__feels {
    font-size: var(--fs-m);
    color: var(--muted);
    margin-top: calc(var(--u) * 0.15);
  }
  .current__feels span { color: var(--text); font-weight: 700; }

  .current__grid {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: space-between;
    grid-gap: calc(var(--u) * 0.9) calc(var(--u) * 1.6);
    border-left: 1px solid var(--panel-edge);
    padding-left: calc(var(--u) * 2.2);
  }
  /* small line under the stats: cheapest electricity hour, day length */
  .current__notes {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    gap: calc(var(--u) * 0.8);
    font-size: var(--fs-xs);
    color: var(--muted);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
  }
  .current__notes b { color: var(--text); font-weight: 600; }
  /* electricity like a traffic light; teal is kept for rain only */
  .price--cheap { color: var(--green); }
  .price--high { color: var(--amber); }
  .price--vhigh { color: var(--red); }
  /* flag day: a little Finnish flag after the date */
  .flag { display: inline-block; height: 0.62em; width: 1.02em; margin-left: 0.35em; vertical-align: 0.05em; border-radius: 2px; }
  .stat__label .wi { display: inline-block; vertical-align: -0.15em; margin-right: 0.3em; stroke: var(--amber); }
  .stat {
    display: flex;
    flex-direction: column;
    gap: calc(var(--u) * 0.15);
    min-width: 0;
  }
  .stat__label {
    font-size: var(--fs-xs);
    font-weight: 500;
    color: var(--muted-dim);
  }
  .stat__value {
    font-size: var(--fs-xl);
    font-weight: 600;
    line-height: 1.05;
    white-space: nowrap;
  }
  .unit {
    font-size: 0.6em;
    font-weight: 500;
    color: var(--muted);
    margin-left: 0.15em;
  }
  .unit--tight { margin-left: 0.02em; }
  .wind-arrow {
    display: inline-block;
    font-style: normal;
    color: var(--muted);
    margin-left: 0.35em;
    font-size: 0.6em;
    vertical-align: 0.1em;
  }
  .wind-dir {
    font-size: 0.6em;
    font-weight: 500;
    color: var(--muted);
    margin-left: 0.1em;
  }

  /* HOURLY / WEEKLY STRIPS */
  .strip {
    flex: 0 0 auto;              /* fixed size: only the departures area flexes */
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    display: flex;
    gap: calc(var(--u) * 0.4);
    padding: calc(var(--u) * 0.5);
    overflow: hidden;
  }
  .strip-item {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(var(--u) * 0.35) calc(var(--u) * 0.2) calc(var(--u) * 0.4);
    border-radius: calc(var(--u) * 1.1);
  }
  .strip-item.is-now {
    background: rgba(255,255,255,0.045);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .strip-item__label {
    font-size: var(--fs-s);
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  .is-now .strip-item__label { color: var(--text); font-weight: 600; }
  .strip-item__icon { font-size: calc(var(--u) * 3.0); margin: calc(var(--u) * 0.2) 0 calc(var(--u) * 0.1); }
  .strip-item__temp {
    font-family: var(--num);
    font-size: var(--fs-xl);
    letter-spacing: -0.01em;
    font-weight: 600;
    line-height: 1.1;
    white-space: nowrap;
  }
  .daily .strip-item__temp { font-size: var(--fs-l); }
  .daily .strip-item__temp-max { color: var(--text); }
  .daily .strip-item__temp-min { color: var(--muted-dim); margin-left: 0.2em; }
  .strip-item__pop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--u) * 0.25);
    margin-top: calc(var(--u) * 0.1);
    width: 100%;
  }
  .pop-num {
    font-family: var(--num);
    font-size: var(--fs-xs);
    font-weight: 500;
    color: var(--teal);
    line-height: 1;
    min-height: var(--fs-xs);
  }
  .pop-bar {
    width: 56%;
    height: calc(var(--u) * 0.35);
    border-radius: 2px;
    background: rgba(79, 209, 197, 0.14);
    overflow: hidden;
  }
  .pop-bar i {
    display: block;
    height: 100%;
    background: var(--teal);
    border-radius: 2px;
  }

  /* DEPARTURES: trains from Kilo (left) and buses from Trillakatu (right) */
  .departures {
    flex: 1 1 0;                 /* exactly the space that's left, whatever the rows */
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: var(--gap);
  }
  .board {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: calc(var(--u) * 0.85) calc(var(--u) * 1.0) calc(var(--u) * 0.4);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .board__title {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 0.7);
    font-size: var(--fs-s);
    font-weight: 600;
    color: var(--muted);
    margin-bottom: calc(var(--u) * 0.5);
  }
  .board__icon { font-size: calc(var(--u) * 2.5); color: var(--muted); }
  .board__icon .wi { stroke: currentColor; }
  /* rows fill the board; any row that wouldn't fit is dropped (see fitBoard) */
  .board__rows {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .dep-row {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    gap: calc(var(--u) * 0.65);
    height: var(--row-h);
    white-space: nowrap;
  }
  .dep-row--split {
    border-top: 1px solid var(--panel-edge);
    margin-top: calc(var(--u) * 0.6);
  }
  .dep__line {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: calc(var(--u) * 3.4);
    height: calc(var(--u) * 3.4);
    padding: 0 calc(var(--u) * 0.4);
    border-radius: calc(var(--u) * 0.7);
    color: #fff;
    font-family: var(--num);
    font-weight: 700;
    font-size: var(--fs-s);
  }
  /* night lines like 114N: smaller digits so the badge stays the usual width */
  .dep__line--long { font-size: calc(var(--u) * 1.5); padding: 0 calc(var(--u) * 0.25); letter-spacing: -0.02em; }
  .dep__line--train { background: #8C4799; }   /* HSL commuter-train purple */
  .dep__line--bus { background: #007AC9; }     /* HSL bus blue */
  .dep__dest {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: var(--fs-m);
    font-weight: 500;
    color: var(--text);
  }
  .dep__when {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 0.45);
  }
  .dep__tag { font-size: var(--fs-xs); font-weight: 500; color: var(--muted); }
  .dep__time {
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    font-size: var(--fs-xl);
    font-weight: 600;
    color: var(--text);
    min-width: calc(var(--u) * 7.4);   /* "22:58" and "14 min" end at the same place */
    text-align: right;
  }
  .dep__min { font-size: 0.6em; font-weight: 500; color: var(--muted); margin-left: 0.2em; }
  /* live-estimate column: only takes room on a board that has an estimate
     right now, and then on every row of that board so the times line up */
  .dep__late:empty { display: none; }
  .has-late .dep__late { display: inline; min-width: calc(var(--u) * 6.6); }
  .dep__late {
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    font-size: var(--fs-s);
    font-weight: 600;
    color: var(--amber);
  }
  .dep-row.is-cancelled .dep__time { text-decoration: line-through; color: var(--muted-dim); }
  .dep-row.is-cancelled .dep__dest { color: var(--muted-dim); }
  .board__empty { font-size: var(--fs-m); color: var(--muted-dim); padding: calc(var(--u) * 0.8) 0; }

  /* small amber dot: the weather on screen is old (fetches have been failing) */
  .stale-dot {
    position: absolute;
    top: calc(var(--u) * 1);
    right: calc(var(--u) * 1);
    width: calc(var(--u) * 1.1);
    height: calc(var(--u) * 1.1);
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(244,169,74,0.2);
  }
  .stale-dot[hidden] { display: none; }

  /* night: dim everything (easier on the eyes, and on the AMOLED screen) */
  .night-dim {
    position: fixed;
    inset: 0;
    z-index: 1400;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 60s linear;
  }

  /* LIGHTNING ALERT (only shown when a strike is within 20 km) */
  .lightning-alert {
    display: none;
    align-items: center;
    gap: calc(var(--u) * 1.4);
    background: linear-gradient(90deg, rgba(232,100,107,0.18), rgba(244,169,74,0.14));
    border: 1px solid rgba(232,100,107,0.55);
    border-radius: var(--radius);
    padding: calc(var(--u) * 0.9) calc(var(--u) * 1.8);
    animation: alertGlow 2.2s ease-in-out infinite;
  }
  .lightning-alert.active { display: flex; }
  .lightning-alert__icon { font-size: calc(var(--u) * 3); line-height: 1; }
  .lightning-alert__text { font-weight: 700; font-size: var(--fs-m); }
  .lightning-alert__sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
  @keyframes alertGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(232,100,107,0); }
    50% { box-shadow: 0 0 20px rgba(232,100,107,0.5); }
  }

  /* KANI EXTRAS */
  .kani {
    --kani-h: calc(var(--u) * 15.6);
    grid-column: 2;
    grid-row: 1 / span 3;
    align-self: end;
    height: var(--kani-h);
    width: calc(var(--kani-h) * 0.925);    /* the drawing is 74 x 80 */
    /* the top of the drawing is headroom for the umbrella: let it tuck into
       the panel's top padding, and the shadow into the bottom padding, so the
       panel doesn't grow */
    margin-top: calc(var(--u) * -1.2);
    margin-bottom: calc(var(--u) * -0.5);
  }
  .kani svg, .kani-hop svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .kani .k-acc, .kani .k-eyes-closed, .kani-hop .k-acc, .kani-hop .k-eyes-closed,
  .kani-giant .k-acc, .kani-giant .k-eyes-closed { display: none; }
  .kani.is-hat .k-acc-hat, .kani.is-cold .k-acc-scarf,
  .kani.is-rain .k-acc-umbrella, .kani.is-snow .k-acc-snow,
  .kani.is-sunny .k-acc-glasses, .kani.is-party .k-acc-party,
  .kani.is-ringette .k-acc-ringette,
  .kani.is-santa .k-acc-santa, .kani.is-rosette .k-acc-rosette, .kani.is-vappu .k-acc-vappu,
  .kani.is-juhannus .k-acc-wreath, .kani.is-halloween .k-acc-pumpkin,
  .kani.is-sleep .k-acc-sleep, .kani.is-sleep .k-eyes-closed { display: inline; }
  .kani.is-sleep .k-eyes-open { display: none; }
  .kani.is-party .k-acc-hat, .kani.is-juhannus .k-acc-hat { display: none; }   /* party hat / wreath win over the beanie */
  .kani.is-santa .k-acc-hat { display: none; }          /* Santa hat replaces the beanie */
  .kani.is-party .k-acc-santa, .kani.is-party .k-acc-wreath { display: none; }

  /* snow pile along the bottom of the weather panel: grows when it snows,
     stays while it's freezing, melts when it gets above zero */
  .snowpile { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 1.1); pointer-events: none; }
  .snowpile svg { display: block; width: 100%; height: 100%; }
  .snowpile[hidden] { display: none; }
  #curTemp, #kani, #clockTime, #clockDate { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-touch-callout: none; }
  html, body { touch-action: manipulation; }   /* no double-tap zoom, so quick taps all count */

  /* speech bubble */
  .kani-bubble {
    position: fixed;
    z-index: 1500;
    max-width: calc(var(--u) * 34);
    padding: calc(var(--u) * 0.8) calc(var(--u) * 1.3);
    border-radius: calc(var(--u) * 1.4);
    background: #EAF2FF;
    color: #0B1220;
    font-size: var(--fs-s);
    font-weight: 600;
    line-height: 1.3;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .kani-bubble.show { opacity: 1; transform: translateY(0); }

  /* carrot and bunny rain */
  .kani-rain { position: fixed; inset: 0; z-index: 2000; pointer-events: none; overflow: hidden; }
  .kani-rain span {
    position: absolute;
    top: -12%;
    line-height: 1;
    animation-name: kaniFall;
    animation-timing-function: cubic-bezier(.35,.05,.65,1);
    animation-fill-mode: both;
  }
  @keyframes kaniFall {
    from { transform: translateY(0) rotate(-20deg); }
    to   { transform: translateY(120vh) rotate(220deg); }
  }

  /* the occasional hop across the bottom of the screen */
  .kani-hop {
    position: fixed;
    left: 0;
    bottom: calc(var(--u) * 1.4);
    width: calc(var(--u) * 6);
    height: calc(var(--u) * 6.5);
    z-index: 1800;
    pointer-events: none;
    animation: kaniRun 9s linear forwards;
  }
  .kani-hop__body { width: 100%; height: 100%; animation: kaniBounce 0.6s ease-in-out infinite; }
  @keyframes kaniRun {
    from { transform: translateX(-12vw); }
    to   { transform: translateX(110vw); }
  }
  @keyframes kaniBounce {
    0%, 100% { transform: translateY(0); }
    45%      { transform: translateY(calc(var(--u) * -2.4)); }
  }

  /* tap the date 5 times: a giant bunny bounces, trembles and talks */
  .kani-giant {
    position: fixed;
    inset: 0;
    z-index: 2100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(6, 9, 20, 0.6);
    animation: giantIn 0.3s ease-out both;
    overflow: hidden;
  }
  .kani-giant.is-leaving { animation: giantOut 0.45s ease-in forwards; }
  .kani-giant__hop {
    height: min(78vh, 96vw / 0.925);
    width: calc(min(78vh, 96vw / 0.925) * 0.925);
    margin-bottom: 2vh;
    transform-origin: 50% 100%;
    animation: giantBounce 0.75s cubic-bezier(.3,.6,.4,1) infinite;
  }
  .kani-giant__shake { width: 100%; height: 100%; animation: giantShake 0.11s linear infinite; }
  .kani-giant__sayrow {
    position: absolute;
    top: 7vh;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }
  .kani-giant__say {
    position: relative;
    padding: calc(var(--u) * 1.6) calc(var(--u) * 3);
    border-radius: calc(var(--u) * 3);
    background: #EAF2FF;
    color: #0B1220;
    font-size: calc(var(--u) * 5.2);
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    animation: giantSay 0.5s cubic-bezier(.2,1.6,.4,1) 0.25s both, giantShake 0.11s linear 0.75s infinite;
    transform-origin: 50% 100%;
  }
  .kani-giant__say::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: calc(var(--u) * -1.6);
    margin-left: calc(var(--u) * -1.6);
    border: calc(var(--u) * 1.6) solid transparent;
    border-top-color: #EAF2FF;
    border-bottom: 0;
  }
  @keyframes giantIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes giantOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes giantBounce {
    0%, 100% { transform: translateY(0) scale(1.05, 0.93); }
    15%      { transform: translateY(0) scale(0.97, 1.04); }
    50%      { transform: translateY(-14vh) scale(0.98, 1.03); }
    85%      { transform: translateY(0) scale(1.02, 0.98); }
  }
  @keyframes giantShake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(-0.9%, 0.3%) rotate(-1.4deg); }
    50%  { transform: translate(0.8%, -0.3%) rotate(1.2deg); }
    75%  { transform: translate(-0.5%, 0.4%) rotate(-0.8deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes giantSay { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Easter: bunny ears on the Now / Today boxes */
  .dash.is-easter .strip-item.is-now { position: relative; padding-top: calc(var(--u) * 1.7); }
  .dash.is-easter .strip-item.is-now::before {
    content: '';
    position: absolute;
    top: calc(var(--u) * 0.15);
    left: 50%;
    width: calc(var(--u) * 0.75);
    height: calc(var(--u) * 1.7);
    margin-left: calc(var(--u) * -1.25);
    border-radius: 50%;
    background: #E6ECF6;
    box-shadow: calc(var(--u) * 1.75) 0 0 #E6ECF6;
    transform: rotate(-8deg);

  .wi-moonbunny { fill: #C9D6EF; stroke: none; opacity: 0.55; }

<script>
(function(){

  var VERSION = '3.3';  // long-press the bunny to see this on the tablet
  var LAT = 60.2179;   // Kilo station, Espoo
  var LON = 24.7824;

  /* ---------- Kani settings (dates only, no names: this page is public) ---------- */
  // Birthdays as 'MM-DD'
  var BIRTHDAYS = ['03-17', '04-22'];

  var RINGETTE_GAME_DATES = [];


  /* ---------- Inline SVG weather icons (duotone, palette-matched) ---------- */
  var WI_CLOUD = 'M18 10h-1.26A8 8 0 1 0 9 20h9a4 4 0 0 0 0-8z';

    var knockCloud = '<g transform="translate(2.6,2.4) scale(0.92)"><path class="wi-cloud wi-knock" d="' + WI_CLOUD + '"/></g>';
    switch (kind){
      case 'clear-day':
        s += '<circle class="wi-sun" cx="12" cy="12" r="4.4"/>' +
             '<path class="wi-sun" d="M12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4l1.4-1.4M18 6l1.4-1.4"/>';
        break;
      case 'clear-night':
        if (isFullMoon()) {
          s += '<circle class="wi-moon" cx="12" cy="12" r="8.6"/>' +
               '<g class="wi-moonbunny"><ellipse cx="11" cy="14.6" rx="2.9" ry="2.1"/><circle cx="13.9" cy="12.6" r="1.5"/>' +
               '<ellipse cx="13.5" cy="10.1" rx=".5" ry="1.5" transform="rotate(-8 13.5 10.1)"/>' +
               '<ellipse cx="14.6" cy="10.2" rx=".5" ry="1.5" transform="rotate(14 14.6 10.2)"/></g>';
        } else {
          s += '<path class="wi-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
        break;
      case 'part-day':
        s += '<circle class="wi-sun" cx="6.2" cy="5.8" r="2.4"/>' +
             '<path class="wi-sun" d="M6.2 1.2v1.4M1.6 5.8h1.4M2.7 2.3l1 1M9.7 2.3l-1 1"/>' + knockCloud;
        break;
      case 'part-night':
        s += (isFullMoon() ? '<circle class="wi-moon" cx="6" cy="5.4" r="3.9"/>'
                           : '<path class="wi-moon" d="M9.5 5.8A4.05 4.05 0 1 1 5.05 1.35a3.15 3.15 0 0 0 4.45 4.45z"/>') + knockCloud;
        break;
      case 'cloud':
        s += '<path class="wi-cloud" d="' + WI_CLOUD + '"/>';
        break;
      case 'fog':
        s += cloudHi + '<path class="wi-fog" d="M5.5 17h13M8 21h9"/>';
        break;
      case 'drizzle':
        s += cloudHi + '<path class="wi-rain" d="M8 13v2M8 19v2M16 13v2M16 19v2M12 15v2M12 21v2"/>';
        break;
      case 'rain':
        s += cloudHi + '<path class="wi-rain" d="M16 13v8M8 13v8M12 15v8"/>';
        break;
      case 'snow':
        s += cloudHi + '<path class="wi-snow wi-flake" d="M8 14.2v4.8M5.92 15.4l4.16 2.4M5.92 17.8l4.16 -2.4M16 14.2v4.8M13.92 15.4l4.16 2.4M13.92 17.8l4.16 -2.4M12 19v4.8M9.92 20.2l4.16 2.4M9.92 22.6l4.16 -2.4"/>'; // three small snowflakes
        break;
      case 'sleet':
        s += cloudHi + '<path class="wi-rain" d="M8 13v6M16 13v6"/>' +
             '<path class="wi-snow" d="M12 17h.01M12 21h.01"/>';
        break;
      case 'thunder':
        s += '<path class="wi-cloud" d="' + WI_BOLT_CLOUD + '"/>' +
             '<polyline class="wi-bolt" points="13 11 9 17 15 17 11 23"/>';
        break;
      default:
        s += '<path class="wi-cloud" d="' + WI_CLOUD + '"/>';
    }
    return s + '</svg>';
  }

  function nightify(kind, day){
    if (day) return kind;
    if (kind === 'clear-day') return 'clear-night';
    if (kind === 'part-day') return 'part-night';
    return kind;
  }

  // true if the given moment falls between today's sunrise and sunset
  function isDayAt(d){
    if (!lastSunrise || !lastSunset) return true;
    function mins(x){
      var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', minute: '2-digit', hour12: false }).format(x).split(':');
      return (parseInt(p[0], 10) % 24) * 60 + parseInt(p[1], 10); // some browsers say "24:05" for 00:05
    }
    var m = mins(d);
    return m >= mins(new Date(lastSunrise)) && m <= mins(new Date(lastSunset));
  }

  // precip probability: thin bar always, numeric label only when it matters
  function popMarkup(pop){
    if (pop === null || typeof pop !== 'number' || isNaN(pop)) {
      return '<div class="strip-item__pop"></div>';
    }
    var p = Math.max(0, Math.min(100, Math.round(pop)));
    var num = p >= 30 ? p + '%' : '';
    // under 10 %: no bar at all (keeps its room, so the strip doesn't jump)
    var hide = p < 10 ? ' style="visibility:hidden"' : '';
    var fillOpacity = (0.35 + 0.65 * p / 100).toFixed(2);
    return '<div class="strip-item__pop">' +
      '<span class="pop-num">' + num + '</span>' +
      '<span class="pop-bar"' + hide + '><i style="width:' + p + '%;opacity:' + fillOpacity + '"></i></span>' +
      '</div>';
  }

  // "12<small>m/s</small>"; a dash if the value is missing
  function withUnit(v, unit){
    if (typeof v !== 'number' || isNaN(v)) return '&ndash;';
    return Math.round(v) + '<span class="unit' + (unit === '%' ? ' unit--tight' : '') + '">' + unit + '</span>';
  }

  function degToCardinal(deg){
    var dirs = ['P','KO','I','KA','E','LO','L','LU'];   // pohjoinen, koillinen, itä, kaakko...
    return dirs[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
  }

  /* ---------- Weather code -> icon kind / label ---------- */
  function wmoInfo(code, isDay){
    var day = isDay !== 0;
    var map = {
      0:  [day ? 'clear-day' : 'clear-night', 'Selkeää'],
      1:  [day ? 'part-day' : 'part-night', 'Melko selkeää'],
      2:  [day ? 'part-day' : 'part-night', 'Puolipilvistä'],
      3:  ['cloud', 'Pilvistä'],
      45: ['fog', 'Sumua'],
      48: ['fog', 'Jäätävää sumua'],
      51: ['drizzle', 'Heikkoa tihkua'],
      53: ['drizzle', 'Tihkusadetta'],
      55: ['rain', 'Voimakasta tihkua'],
      56: ['sleet', 'Jäätävää tihkua'],
      57: ['sleet', 'Jäätävää tihkua'],
      61: ['rain', 'Heikkoa sadetta'],
      63: ['rain', 'Sadetta'],
      65: ['rain', 'Rankkaa sadetta'],
      66: ['sleet', 'Jäätävää sadetta'],
      67: ['sleet', 'Jäätävää sadetta'],
      71: ['snow', 'Heikkoa lumisadetta'],
      73: ['snow', 'Lumisadetta'],
      75: ['snow', 'Kovaa lumisadetta'],
      77: ['snow', 'Lumijyväsiä'],
      80: ['drizzle', 'Heikkoja kuuroja'],
      81: ['rain', 'Sadekuuroja'],
      82: ['rain', 'Rankkoja kuuroja'],
      85: ['snow', 'Lumikuuroja'],
      86: ['snow', 'Kovia lumikuuroja'],
      95: ['thunder', 'Ukkosta'],
      96: ['thunder', 'Ukkosta ja rakeita'],
      99: ['thunder', 'Ukkosta ja rakeita']
    };
    if (map[code]) return map[code];
    return ['cloud', '\u2014'];
  }

  function fmtTime(d){
    return d.toLocaleTimeString('en-GB', { timeZone:'Europe/Helsinki', hour:'2-digit', minute:'2-digit' });
  }

  /* ---------- Flag days (official and customary, Finland) ---------- */
  var FLAG_DAYS = {
    '02-05': 'J. L. Runebergin päivä', '02-28': 'Kalevalan päivä',
    '03-19': 'Minna Canthin päivä, tasa-arvon päivä', '04-09': 'Mikael Agricolan päivä, suomen kielen päivä',
    '04-27': 'Kansallinen veteraanipäivä', '05-01': 'Vappu, suomalaisen työn päivä', '05-09': 'Eurooppa-päivä',
    '05-12': 'J. V. Snellmanin päivä, suomalaisuuden päivä', '06-04': 'Puolustusvoimain lippujuhlan päivä',
    '07-06': 'Eino Leinon päivä, runon ja suven päivä', '10-01': 'Miina Sillanpään ja kansalaisvaikuttamisen päivä',
    '10-10': 'Aleksis Kiven päivä, suomalaisen kirjallisuuden päivä', '10-24': 'YK:n päivä',
    '11-06': 'Ruotsalaisuuden päivä', '11-20': 'Lapsen oikeuksien päivä', '12-06': 'Itsenäisyyspäivä',
    '12-08': 'Jean Sibeliuksen päivä, suomalaisen musiikin päivä'
  };
  // the n-th given weekday (0 = Sunday) of a month; n = -1: the last one
  function nthWeekday(y, m, wd, n){
    if (n > 0){
      var first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
      return 1 + ((wd - first + 7) % 7) + (n - 1) * 7;
    }
    var lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var lastWd = new Date(Date.UTC(y, m - 1, lastDay)).getUTCDay();
    return lastDay - ((lastWd - wd + 7) % 7);
  }
  // today's flag day name in Helsinki, or ''
  function flagDay(){
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Helsinki', year: 'numeric', month: '2-digit', day: '2-digit' })
      .format(new Date()).split('-');
    var y = +parts[0], m = +parts[1], d = +parts[2];
    var fixed = FLAG_DAYS[parts[1] + '-' + parts[2]];
    if (fixed) return fixed;
    if (m === 5 && d === nthWeekday(y, 5, 0, 2)) return 'Äitienpäivä';
    if (m === 5 && d === nthWeekday(y, 5, 0, 3)) return 'Kaatuneitten muistopäivä';
    if (m === 6 && d >= 20 && d <= 26 && new Date(Date.UTC(y, 5, d)).getUTCDay() === 6) return 'Juhannuspäivä, Suomen lipun päivä';
    if (m === 8 && d === nthWeekday(y, 8, 6, -1)) return 'Suomen luonnon päivä';
    if (m === 11 && d === nthWeekday(y, 11, 0, 2)) return 'Isänpäivä';
    return '';
  }
  var FLAG_SVG = '<svg class="flag" viewBox="0 0 18 11" aria-hidden="true"><rect width="18" height="11" fill="#fff"/><rect x="5" width="3" height="11" fill="#1F4FA3"/><rect y="4" width="18" height="3" fill="#1F4FA3"/></svg>';

  /* ---------- Clock ---------- */
  function tickClock(){
    var now = new Date();
    var p = now.toLocaleTimeString('en-GB', { timeZone:'Europe/Helsinki', hour:'2-digit', minute:'2-digit' }).split(':');
    var weekday = now.toLocaleDateString('fi-FI', { timeZone:'Europe/Helsinki', weekday:'long' });
    weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);      // "lauantai" -> "Lauantai"
    var dayMonth = now.toLocaleDateString('fi-FI', { timeZone:'Europe/Helsinki', day:'numeric', month:'long' });   // "21. marraskuuta" 
    var hm = p[0] + ':' + p[1], clockEl = document.getElementById('clockTime');
    if (clockEl.textContent !== hm) clockEl.textContent = hm;      // no seconds: a calmer wall display
    var html = '<span class="clock__weekday">' + weekday + '</span> <span class="clock__daymonth">' + dayMonth + '</span>' +
      (flagDay() ? FLAG_SVG : '');
    var dateEl = document.getElementById('clockDate');
    if (dateEl.innerHTML !== html) { dateEl.innerHTML = html; fitHeader(); }
  }
  // a long date (+ flag) must never run into the clock: shrink it if it would
  function fitHeader(){
    var d = document.getElementById('clockDate'), c = document.getElementById('clockTime');
    d.style.fontSize = '';
    var size = parseFloat(window.getComputedStyle(d).fontSize), guard = 20;
    while (d.getBoundingClientRect().right > c.getBoundingClientRect().left - 16 && guard-- > 0){
      size *= 0.95;
      d.style.fontSize = size.toFixed(1) + 'px';
    }
  }
  tickClock();
  setInterval(tickClock, 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeader);
  window.addEventListener('resize', fitHeader);

  /* ---------- FMI WFS helpers ---------- */
  function isoNoMillis(d){

  // FMI's WFS "Download Service" (lightning, observations, forecast) is
  // intended for continuous use by applications, per FMI's open data terms.
  var FMI_WFS_URL = 'https://opendata.fmi.fi/wfs';

  function buildFmiUrl(storedQueryId, extraParams){
    var url = FMI_WFS_URL + '?service=WFS&version=2.0.0&request=getFeature&storedquery_id=' + encodeURIComponent(storedQueryId);
    for (var key in extraParams){
      if (extraParams.hasOwnProperty(key)){
        url += '&' + key + '=' + encodeURIComponent(extraParams[key]);
      }
    }
    return url;
  }

  // Rejects on HTTP errors and on FMI's XML ExceptionReport, so callers'
  // .catch() runs instead of silently treating an error as "no data".
  function fetchFmiXml(url){
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error('FMI HTTP ' + r.status);
      return r.text();
    }).then(function(text){
      var parser = new DOMParser();
      var doc = parser.parseFromString(text, 'text/xml');
      if (doc.getElementsByTagName('parsererror').length ||
          doc.getElementsByTagName('ExceptionReport').length ||
          doc.getElementsByTagName('ows:ExceptionReport').length) {
        throw new Error('FMI exception');
      }
      return doc;
    });
  }

  // Parses FMI's "simple feature" WFS format: a flat list of
  // <BsWfs:BsWfsElement> rows, one per (location, time, parameter).
  function parseBsWfsElements(doc){
    var elements = doc.getElementsByTagName('BsWfs:BsWfsElement');
    var rows = [];
    for (var i = 0; i < elements.length; i++){
      var el = elements[i];
      var timeEl = el.getElementsByTagName('BsWfs:Time')[0];
      var posEl = el.getElementsByTagName('gml:pos')[0];
      var nameEl = el.getElementsByTagName('BsWfs:ParameterName')[0];
      var valEl = el.getElementsByTagName('BsWfs:ParameterValue')[0];
      if (!timeEl || !nameEl || !valEl) continue;
      var lat = null, lon = null;
      if (posEl) {
        var parts = posEl.textContent.trim().split(/\s+/);
        lat = parseFloat(parts[0]);
        lon = parseFloat(parts[1]);
      }
      rows.push({
        time: timeEl.textContent,
        lat: lat,
        lon: lon,
        name: nameEl.textContent,
        value: parseFloat(valEl.textContent)
      });
    }
    return rows;
  }

  /* ---------- Lightning ---------- */
  function loadLightning(){
    var end = new Date();
    var start = new Date(end.getTime() - 60 * 60 * 1000);
    var url = buildFmiUrl('fmi::observations::lightning::simple', {
      bbox: '24.3,59.98,25.3,60.45',   // ~25 km around Kilo; the alert uses 20 km
      starttime: isoNoMillis(start),
      endtime: isoNoMillis(end)
    });
    fetchFmiXml(url).then(function(doc){
      var rows = parseBsWfsElements(doc);
      var groups = {};
      for (var i = 0; i < rows.length; i++){
        var r = rows[i];
        if (r.lat === null || isNaN(r.lat)) continue;
        var key = r.time + '|' + r.lat.toFixed(3) + ',' + r.lon.toFixed(3);
        if (!groups[key]) groups[key] = { time: r.time, lat: r.lat, lon: r.lon, params: {} };
        groups[key].params[r.name] = r.value;
      }
      var strikes = [];
      for (var k in groups){ if (groups.hasOwnProperty(k)) strikes.push(groups[k]); }
      renderLightning(strikes);
    }).catch(function(){ /* keep the alert as it is; try again next round */ });
  }

  // Distance in km between two lat/lon points (haversine formula)
  function haversineKm(lat1, lon1, lat2, lon2){
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  var LIGHTNING_ALERT_RADIUS_KM = 20;
  var LIGHTNING_ALERT_WINDOW_MIN = 30; // standard "wait before it's safe" window

  function updateLightningAlert(strikes){
    var now = Date.now();
    var nearest = null;
    for (var i = 0; i < strikes.length; i++){
      var s = strikes[i];
      var ageMin = (now - new Date(s.time).getTime()) / 60000;
      if (ageMin < 0 || ageMin > LIGHTNING_ALERT_WINDOW_MIN) continue;
      var dist = haversineKm(LAT, LON, s.lat, s.lon);
      if (dist <= LIGHTNING_ALERT_RADIUS_KM && (!nearest || dist < nearest.dist)){
        nearest = { dist: dist, ageMin: ageMin };
      }
    }
    var el = document.getElementById('lightningAlert');
    if (nearest){
      el.classList.add('active');
      document.getElementById('lightningAlertText').textContent =
        'Salamoi ' + LIGHTNING_ALERT_RADIUS_KM + ' km:n säteellä';
      var ageLabel = nearest.ageMin < 1 ? 'juuri nyt' : Math.round(nearest.ageMin) + ' min sitten';
      document.getElementById('lightningAlertSub').textContent =
        'Lähin isku ' + nearest.dist.toFixed(1).replace('.', ',') + ' km päässä \u00B7 ' + ageLabel;
    } else {
      el.classList.remove('active');
    }
  }

  function renderLightning(strikes){
    var wasActive = document.getElementById('lightningAlert').classList.contains('active');
    updateLightningAlert(strikes);
    // the alert banner takes room from the departures (and gives it back)
    if (document.getElementById('lightningAlert').classList.contains('active') !== wasActive) renderDepartures();
  }

  loadLightning();
  setInterval(loadLightning, 2 * 60 * 1000);

  /* ---------- FMI symbol -> icon kind (used by hourly/daily strip upgrade) ---------- */
  // FMI WeatherSymbol3 table:
  //  1 clear, 2 partly cloudy, 3 cloudy,
  //  21-23 rain showers, 31-33 rain,
  //  41-43 SNOW showers, 51-53 snowfall,
  //  61-64 thunder, 71-73 sleet showers, 81-83 sleet, 91-92 mist/fog
  function fmiSymbolIcon(code){
    if (typeof code !== 'number' || isNaN(code)) return 'cloud';
    var c = code % 100; // ignore any day/night offset variants
    if (c === 1) return 'clear-day';
    if (c === 2) return 'part-day';
    if (c === 3) return 'cloud';
    if (c === 21) return 'drizzle';
    if (c >= 22 && c <= 23) return 'rain';
    if (c >= 31 && c <= 33) return 'rain';
    if (c >= 41 && c <= 43) return 'snow';
    if (c >= 51 && c <= 53) return 'snow';
    if (c >= 61 && c <= 64) return 'thunder';
    if (c >= 71 && c <= 73) return 'sleet';
    if (c >= 81 && c <= 83) return 'sleet';
    if (c >= 91 && c <= 92) return 'fog';
    return 'cloud';
  }

  /* ---------- Sunrise / sunset (header) + day/night tint ---------- */
  var lastSunrise = null;
  var lastSunset = null;

  // Open-Meteo returns naive Helsinki wall-clock strings ("2026-11-20T08:43").
  // new Date() on those uses the DEVICE's timezone, which is wrong on a device
  // set to UTC. Use the utc_offset_seconds Open-Meteo sends instead.
  function omDate(s, offsetSec){
    if (typeof offsetSec !== 'number') return new Date(s);
    var iso = s.length === 16 ? s + ':00Z' : s + 'Z';
    return new Date(Date.parse(iso) - offsetSec * 1000);
  }

  function updateSunArc(sunrise, sunset){
    lastSunrise = sunrise;
    lastSunset = sunset;
    var now = new Date();

    document.getElementById('headerSunrise').textContent = fmtTime(sunrise);
    document.getElementById('headerSunset').textContent = fmtTime(sunset);

    updateTint(now, sunrise, sunset);
  }

  // "Päivä 6 h 53 min, −3 min": today's daylight and the change from yesterday
  function renderDayLength(daily, di, off){
    var el = document.getElementById('dayLength');
    // daylight_duration is in seconds (sunrise/sunset are rounded to the
    // minute, so their difference can be a minute off)
    function len(i){
      if (i < 0) return null;
      if (daily.daylight_duration && typeof daily.daylight_duration[i] === 'number') return daily.daylight_duration[i] / 60;
      if (!daily.sunrise[i] || !daily.sunset[i]) return null;
      return (omDate(daily.sunset[i], off) - omDate(daily.sunrise[i], off)) / 60000;
    }
    var today = len(di), yesterday = len(di - 1);
    if (today === null) { el.textContent = ''; return; }
    var total = Math.round(today), h = Math.floor(total / 60), m = total - h * 60;
    var txt = 'Päivä <b>' + h + ' h ' + m + ' min</b>';
    if (yesterday !== null) {
      var diff = Math.round(today - yesterday);
      txt += ' ' + (diff > 0 ? '+' + diff : diff < 0 ? '\u2212' + (-diff) : '\u00b10') + ' min';
    }
    el.innerHTML = txt;
  }

  /* ---------- Day / night tint ---------- */
  function updateTint(now, sunrise, sunset){
    var duskWindow = 45 * 60 * 1000; // 45 min soft transition either side
    var t = now.getTime();
    var nightFactor;

    if (t < sunrise.getTime() - duskWindow || t > sunset.getTime() + duskWindow) {
      nightFactor = 1;
    } else if (t < sunrise.getTime() + duskWindow) {
      nightFactor = 1 - (t - (sunrise.getTime() - duskWindow)) / (2 * duskWindow);
    } else if (t < sunset.getTime() - duskWindow) {
      nightFactor = 0;
    } else {
      nightFactor = (t - (sunset.getTime() - duskWindow)) / (2 * duskWindow);
    }
    if (nightFactor < 0) nightFactor = 0;
    if (nightFactor > 1) nightFactor = 1;

    var duskFactor = nightFactor * (1 - nightFactor) * 4; // peaks at 1 around the transition zones

    document.getElementById('nightTint').style.opacity = (nightFactor * 0.85).toFixed(2);
    document.getElementById('duskTint').style.opacity = (duskFactor * 0.9).toFixed(2);
  }

  /* ---------- Weather data ---------- */
  var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + LAT + '&longitude=' + LON
    + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day'
    + '&hourly=temperature_2m,precipitation_probability,weather_code'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,daylight_duration'
    + '&timezone=Europe%2FHelsinki&forecast_days=7&past_days=1&wind_speed_unit=ms';   // yesterday: for the day-length change

  // Builds a "YYYY-MM-DDTHH" prefix for the current moment in Europe/Helsinki
  // wall-clock time, matching Open-Meteo's naive local timestamps exactly —
  // regardless of what timezone the device itself is set to.
  function helsinkiHourPrefixNow(){
    var fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Helsinki',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', hour12: false
    });
    var parts = fmt.formatToParts(new Date());
    var obj = {};
    for (var i = 0; i < parts.length; i++){ obj[parts[i].type] = parts[i].value; }
    var hh = obj.hour === '24' ? '00' : obj.hour;
    return obj.year + '-' + obj.month + '-' + obj.day + 'T' + hh;
  }

  // the next few hours, for the bunny's clothing tip: [{ kind, pop }]
  var nextHours = [];

  function renderHourly(hourly, offsetSec){
    var container = document.getElementById('hourlyStrip');
    container.innerHTML = '';
    nextHours = [];
    var nowPrefix = helsinkiHourPrefixNow();
    var startIdx = 0;
    for (var i = 0; i < hourly.time.length; i++){
      if (hourly.time[i].slice(0,13) >= nowPrefix) { startIdx = i; break; }
    }
    var count = 0;
    for (var j = startIdx; j < hourly.time.length && count < 9; j++, count++){
      var t = omDate(hourly.time[j], offsetSec);
      var info = wmoInfo(hourly.weather_code[j], isDayAt(t) ? 1 : 0);
      if (count < 4) nextHours.push({ kind: info[0], pop: hourly.precipitation_probability[j] });
      var item = document.createElement('div');
      item.className = count === 0 ? 'strip-item is-now' : 'strip-item';
      item.innerHTML =
        '<div class="strip-item__label">' + (count === 0 ? 'Nyt' : fmtTime(t)) + '</div>' +
        '<div class="strip-item__icon">' + svgIcon(info[0]) + '</div>' +
        '<div class="strip-item__temp">' + Math.round(hourly.temperature_2m[j]) + '&deg;</div>' +
        popMarkup(hourly.precipitation_probability[j]);
      container.appendChild(item);
    }
  }

  function renderDaily(daily, first){
    var container = document.getElementById('dailyStrip');
    container.innerHTML = '';
    var dayNames = ['Su','Ma','Ti','Ke','To','Pe','La'];
    for (var n = 0; n < 7 && (first || 0) + n < daily.time.length; n++){
      var i = (first || 0) + n;
      var d = new Date(daily.time[i] + 'T12:00:00');
      var info = wmoInfo(daily.weather_code[i], 1);
      var label = n === 0 ? 'Tänään' : dayNames[d.getDay()];
      var item = document.createElement('div');
      item.className = n === 0 ? 'strip-item is-now' : 'strip-item';
      item.innerHTML =
        '<div class="strip-item__label">' + label + '</div>' +
        '<div class="strip-item__icon">' + svgIcon(info[0]) + '</div>' +
        '<div class="strip-item__temp"><span class="strip-item__temp-max">' + Math.round(daily.temperature_2m_max[i]) + '&deg;</span>' +
        ' <span class="strip-item__temp-min">' + Math.round(daily.temperature_2m_min[i]) + '&deg;</span></div>' +
        popMarkup(daily.precipitation_probability_max[i]);
      container.appendChild(item);
    }
    fitDailyTemps();
  }

  // A very cold week (e.g. -19° -22°) can be wider than the 7 narrow portrait
  // columns. If so, shrink all the weekly temperatures together until they fit.
  function fitDailyTemps(){
    var temps = document.querySelectorAll('#dailyStrip .strip-item__temp');
    if (!temps.length) return;
    var i, scale = 1;
    for (i = 0; i < temps.length; i++) temps[i].style.fontSize = '';
    for (i = 0; i < temps.length; i++){
      var room = temps[i].parentNode.clientWidth - 6;
      var need = temps[i].offsetWidth;
      if (need > room) scale = Math.min(scale, room / need);
    }
    if (scale < 1){
      var base = parseFloat(window.getComputedStyle(temps[0]).fontSize);
      for (i = 0; i < temps.length; i++) temps[i].style.fontSize = (base * scale).toFixed(1) + 'px';
    }
  }

  var weatherTimer = null;
  var lastWeatherOkAt = 0;

  // A single timer: 10 min after success, 1 min after a failure. (A plain
  // setInterval would wait the full 10 minutes to retry.)
  function scheduleWeather(ms){
    clearTimeout(weatherTimer);
    weatherTimer = setTimeout(loadWeather, ms);
  }

  function loadWeather(){
    // FMI strips are fetched independently, so they still appear if
    // Open-Meteo is down.
    loadFmiForecastStrips();

    fetch(WEATHER_URL)
      .then(function(r){
        if (!r.ok) throw new Error('Open-Meteo HTTP ' + r.status);
        return r.json();
      })
      .then(function(data){
        var off = data.utc_offset_seconds;
        var cur = data.current;
        var info = wmoInfo(cur.weather_code, cur.is_day);

        document.getElementById('curIcon').innerHTML = svgIcon(info[0]);
        document.getElementById('curCond').textContent = info[1];
        document.getElementById('curTemp').innerHTML = Math.round(cur.temperature_2m) + '&deg;';
        document.getElementById('curFeels').innerHTML = Math.round(cur.apparent_temperature) + '&deg;';
        kaniSetWeather(cur.temperature_2m, info[0], cur.weather_code, cur.apparent_temperature);

        var windHtml = withUnit(cur.wind_speed_10m, 'm/s');
        if (typeof cur.wind_direction_10m === 'number' && !isNaN(cur.wind_direction_10m)){
          var blowTo = Math.round((cur.wind_direction_10m + 180) % 360);
          windHtml += '<i class="wind-arrow" style="transform:rotate(' + blowTo + 'deg)">&#8593;</i><span class="wind-dir">' + degToCardinal(cur.wind_direction_10m) + '</span>';
        }
        document.getElementById('curWind').innerHTML = windHtml;
        document.getElementById('curGust').innerHTML = withUnit(cur.wind_gusts_10m, 'm/s');
        document.getElementById('curHumidity').innerHTML = withUnit(cur.relative_humidity_2m, '%');
        fitKani();

        // daily data starts with yesterday (past_days=1): find today
        var di = data.daily.time.indexOf(helsinkiDateKey(new Date()));
        if (di < 0) di = 0;
        // sun times first, so hourly icons can pick day/night variants
        updateSunArc(omDate(data.daily.sunrise[di], off), omDate(data.daily.sunset[di], off));
        renderDayLength(data.daily, di, off);
        // Open-Meteo strips are only a fallback: paint them if FMI hasn't
        // succeeded recently, otherwise the strips would flip between the two
        // sources every refresh.
        if (Date.now() - fmiStripsOkAt > 30 * 60 * 1000) {
          renderHourly(data.hourly, off);
          renderDaily(data.daily, di);
        } else if (pendingFmiHourly) {
          renderHourlyFmi(pendingFmiHourly.byTime, pendingFmiHourly.times);
          pendingFmiHourly = null;
        }

        lastWeatherOkAt = Date.now();
        scheduleWeather(10 * 60 * 1000);
      })
      .catch(function(){
        scheduleWeather(60 * 1000);   // retry soon
      });
  }

  /* ---------- FMI edited-weather forecast (upgrades hourly/daily strips) ---------- */
  var fmiStripsOkAt = 0;
  var pendingFmiHourly = null;

  // Start of today (00:00) in Helsinki, as a Date
  function helsinkiMidnight(){
    var now = new Date();
    var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now).split(':');
    var h = parseInt(p[0], 10) % 24, m = parseInt(p[1], 10), s = parseInt(p[2], 10);
    return new Date(now.getTime() - ((h * 60 + m) * 60 + s) * 1000 - now.getMilliseconds());
  }

  function helsinkiDateKey(d){
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Helsinki', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  }

  function helsinkiHour(d){
    return parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', hour12: false }).format(d), 10) % 24;
  }

  function renderHourlyFmi(byTime, futureTimes){
    var container = document.getElementById('hourlyStrip');
    container.innerHTML = '';
    nextHours = [];
    var count = 0;
    for (var j = 0; j < futureTimes.length && count < 9; j++, count++){
      var iso = futureTimes[j];
      var d = new Date(iso);
      var entry = byTime[iso];
      var icon = svgIcon(nightify(fmiSymbolIcon(entry.WeatherSymbol3), isDayAt(d)));
      var temp = Math.round(entry.Temperature);
      var pop = (typeof entry.PoP === 'number') ? Math.round(entry.PoP) : null;
      if (count < 4) nextHours.push({ kind: fmiSymbolIcon(entry.WeatherSymbol3), pop: pop });
      var item = document.createElement('div');
      item.className = count === 0 ? 'strip-item is-now' : 'strip-item';
      item.innerHTML =
        '<div class="strip-item__label">' + (count === 0 ? 'Nyt' : fmtTime(d)) + '</div>' +
        '<div class="strip-item__icon">' + icon + '</div>' +
        '<div class="strip-item__temp">' + temp + '&deg;</div>' +
        popMarkup(pop);
      container.appendChild(item);
    }
  }

  function renderDailyFmi(byTime, futureTimes){
    var byDay = {};
    var order = [];
    for (var i = 0; i < futureTimes.length; i++){
      var iso = futureTimes[i];
      var d = new Date(iso);
      var key = helsinkiDateKey(d);
      if (!byDay[key]) { byDay[key] = { temps: [], pops: [], symbol: null, symbolDist: -1 }; order.push(key); }
      var entry = byTime[iso];
      if (typeof entry.Temperature === 'number') byDay[key].temps.push(entry.Temperature);
      if (typeof entry.PoP === 'number') byDay[key].pops.push(entry.PoP);
      if (typeof entry.WeatherSymbol3 === 'number'){
        var dist = Math.abs(helsinkiHour(d) - 14); // pick the symbol nearest early afternoon
        if (byDay[key].symbolDist === -1 || dist < byDay[key].symbolDist){
          byDay[key].symbol = entry.WeatherSymbol3;
          byDay[key].symbolDist = dist;
        }
      }
    }

    var container = document.getElementById('dailyStrip');
    container.innerHTML = '';
    var dayNames = ['Su','Ma','Ti','Ke','To','Pe','La'];
    var todayKey = helsinkiDateKey(new Date());
    var count = 0;
    for (var k = 0; k < order.length && count < 7; k++){
      var key = order[k];
      var day = byDay[key];
      if (day.temps.length === 0) continue;
      count++;
      var max = Math.max.apply(null, day.temps);
      var min = Math.min.apply(null, day.temps);
      var pop = day.pops.length ? Math.round(Math.max.apply(null, day.pops)) : null;
      var icon = svgIcon(fmiSymbolIcon(day.symbol));
      var parts = key.split('-');
      var dateObj = new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, parseInt(parts[2],10));
      var label = key === todayKey ? 'Tänään' : dayNames[dateObj.getDay()];
      var item = document.createElement('div');
      item.className = key === todayKey ? 'strip-item is-now' : 'strip-item';
      item.innerHTML =
        '<div class="strip-item__label">' + label + '</div>' +
        '<div class="strip-item__icon">' + icon + '</div>' +
        '<div class="strip-item__temp"><span class="strip-item__temp-max">' + Math.round(max) + '&deg;</span>' +
        ' <span class="strip-item__temp-min">' + Math.round(min) + '&deg;</span></div>' +
        popMarkup(pop);
      container.appendChild(item);
    }
    fitDailyTemps();
  }

  function loadFmiForecastStrips(){
    var end = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
    var url = buildFmiUrl('fmi::forecast::edited::weather::scandinavia::point::simple', {
      latlon: LAT + ',' + LON,
      parameters: 'Temperature,WeatherSymbol3,PoP',
      timestep: 60,
      starttime: isoNoMillis(helsinkiMidnight()), // so "Today" gets a full-day min/max
      endtime: isoNoMillis(end)
    });
    fetchFmiXml(url).then(function(doc){
      var rows = parseBsWfsElements(doc);
      if (rows.length === 0) return;
      var byTime = {};
      for (var i = 0; i < rows.length; i++){
        var r = rows[i];
        if (isNaN(r.value)) continue;
        if (!byTime[r.time]) byTime[r.time] = {};
        byTime[r.time][r.name] = r.value;
      }
      var times = [];
      for (var t in byTime){
        if (byTime.hasOwnProperty(t) && typeof byTime[t].Temperature === 'number') times.push(t);
      }
      times.sort();
      // Hourly strip starts at the CURRENT hour (so "Now" really is now),
      // not the next whole hour.
      var hourStartMs = Date.now() - (Date.now() % (60 * 60 * 1000));
      var hourStartIso = isoNoMillis(new Date(hourStartMs));
      var fromNow = [];
      for (var j = 0; j < times.length; j++){ if (times[j] >= hourStartIso) fromNow.push(times[j]); }
      if (fromNow.length === 0) return;

      renderHourlyFmi(byTime, fromNow);
      renderDailyFmi(byTime, times); // all of today from midnight, for a true daily min/max
      fmiStripsOkAt = Date.now();
      // If this arrived before Open-Meteo's sunrise/sunset, redraw once they're
      // known so night hours don't get sun icons.
      pendingFmiHourly = lastSunrise ? null : { byTime: byTime, times: fromNow };
    }).catch(function(){ /* Open-Meteo strips (if any) stay as-is */ });
  }

  /* ---------- Electricity spot price (spot-hinta.fi: free, no key) ---------- */
  // Today's and (from ~14:00) tomorrow's prices in 15-minute slots, VAT
  // included; the electricity company's margin and transfer fees are not.
  var PRICE_URL = 'https://api.spot-hinta.fi/TodayAndDayForward';
  var PRICE_CHEAP = 5, PRICE_HIGH = 10, PRICE_VHIGH = 20;   // c/kWh: colour limits
  var priceSlots = [], priceTimer = null;

  function loadPrices(){
    fetch(PRICE_URL).then(function(r){
      if (!r.ok) throw new Error('price HTTP ' + r.status);
      return r.json();
    }).then(function(list){
      var out = [];
      for (var i = 0; i < (list || []).length; i++){
        var t = Date.parse(list[i].DateTime), p = list[i].PriceWithTax;
        if (!isNaN(t) && typeof p === 'number') out.push({ t: t, p: p * 100 });   // EUR -> cents
      }
      out.sort(function(a, b){ return a.t - b.t; });
      if (out.length) priceSlots = out;
      renderPrice();
      schedulePrices(60 * 60 * 1000);
    }).catch(function(){
      renderPrice();                 // keep using what we have (it covers today)
      schedulePrices(10 * 60 * 1000);
    });
  }
  function schedulePrices(ms){
    clearTimeout(priceTimer);
    priceTimer = setTimeout(loadPrices, ms);
  }
  function fmtCents(c){
    var s = Math.abs(c) >= 9.95 ? Math.round(c).toString() : c.toFixed(1).replace('.', ',');
    return s.replace('-', '\u2212');
  }
  function renderPrice(){
    var now = Date.now(), el = document.getElementById('curPrice'), note = document.getElementById('cheapHour');
    var slotLen = priceSlots.length > 1 ? priceSlots[1].t - priceSlots[0].t : 15 * 60 * 1000;
    var cur = null;
    for (var i = 0; i < priceSlots.length; i++){
      if (priceSlots[i].t <= now && now < priceSlots[i].t + slotLen) { cur = priceSlots[i]; break; }
    }
    if (!cur) { el.innerHTML = '&ndash;'; el.className = 'stat__value num'; note.textContent = ''; return; }
    el.innerHTML = fmtCents(cur.p) + '<span class="unit">snt</span>';
    el.className = 'stat__value num' + (cur.p < PRICE_CHEAP ? ' price--cheap' : cur.p >= PRICE_VHIGH ? ' price--vhigh' : cur.p >= PRICE_HIGH ? ' price--high' : '');
    // cheapest whole clock hour from this hour on, within the next 24 h
    var byHour = {}, hours = [];
    var hourNow = now - (now % (60 * 60 * 1000));
    for (var j = 0; j < priceSlots.length; j++){
      var s = priceSlots[j], hk = s.t - (s.t % (60 * 60 * 1000));
      if (hk < hourNow || hk >= hourNow + 24 * 60 * 60 * 1000) continue;
      if (!byHour[hk]) { byHour[hk] = []; hours.push(hk); }
      byHour[hk].push(s.p);
    }
    var best = null, bestAvg = 0;
    for (var k = 0; k < hours.length; k++){
      var ps = byHour[hours[k]], sum = 0;
      for (var q = 0; q < ps.length; q++) sum += ps[q];
      var avg = sum / ps.length;
      if (best === null || avg < bestAvg) { best = hours[k]; bestAvg = avg; }
    }
    if (best === null) { note.textContent = ''; return; }
    var h1 = helsinkiHour(new Date(best)), h2 = h1 + 1;   // "klo 23–24" 
    note.innerHTML = best === hourNow ? 'Halvin <b>nyt</b>' : 'Halvin <b>' + h1 + '\u2013' + h2 + '</b>';
    fitKani();
  }
  loadPrices();
  setInterval(renderPrice, 60 * 1000);

  /* ---------- Trains from Kilo (Fintraffic Digitraffic: free, no key) ---------- */
  // Station KIL = Kilo. Trains towards Helsinki are listed first, then the
  // westbound ones (E to Kauklahti, U to Kirkkonummi...), each with its destination.
  var TRAIN_STATION = 'KIL';
  var TRAINS_REQUESTED = 20;
  var TRAIN_ROWS = [5, 5];   // most rows: [towards Helsinki, westbound]; fewer if they don't fit
  var NIGHT_GAP_MS = 90 * 60 * 1000;   // a gap this long means "last train" / "first train"
  var TRAIN_URL = 'https://rata.digitraffic.fi/api/v1/live-trains/station/' + TRAIN_STATION +
    '?arrived_trains=0&arriving_trains=0&departed_trains=0&departing_trains=' + TRAINS_REQUESTED + '&include_nonstopping=false';
  var DIGITRAFFIC_USER = 'weatherkilo/1.0'; // Fintraffic asks apps to identify themselves
  var STATION_NAMES = { HKI: 'Helsinki', PSL: 'Pasila', LPV: 'Leppävaara', KEA: 'Kera', EPO: 'Espoo',
    KLH: 'Kauklahti', MAS: 'Masala', KKN: 'Kirkkonummi', SIU: 'Siuntio', KIL: 'Kilo' };

  var trainDepartures = [];   // [{ line, dest, east, ms, sched, cancelled }]
  var trainsOkAt = 0;
  var trainsFailed = false;
  var trainsTimer = null;
  var sendUserHeader = true;  // dropped only if the browser refuses the custom header

  function fetchTrains(){
    var opts = sendUserHeader ? { headers: { 'Digitraffic-User': DIGITRAFFIC_USER } } : {};
    return fetch(TRAIN_URL, opts)
      .catch(function(err){
        if (!sendUserHeader) throw err;
        // Retry without the header. Only stop sending it if that works, so a
        // Wi-Fi blip doesn't make the dashboard anonymous until a reload.
        return fetch(TRAIN_URL).then(function(r){ sendUserHeader = false; return r; });
      })
      .then(function(r){
        if (!r.ok) throw new Error('Digitraffic HTTP ' + r.status);
        return r.json();
      });
  }

  function parseTrains(trains){
    var out = [];
    for (var i = 0; i < trains.length; i++){
      var tr = trains[i];
      var rows = tr.timeTableRows || [];
      var k = -1;
      for (var j = 0; j < rows.length; j++){
        if (rows[j].stationShortCode === TRAIN_STATION && rows[j].type === 'DEPARTURE') { k = j; break; }
      }
      if (k < 0) continue;
      var row = rows[k];
      if (row.trainStopping === false || row.commercialStop === false) continue;
      if (row.actualTime) continue;          // already left
      var sched = Date.parse(row.scheduledTime);
      var ms = Date.parse(row.liveEstimateTime || row.scheduledTime);
      if (isNaN(ms) || isNaN(sched)) continue;
      var east = false;                      // heading towards Helsinki?
      for (var m = k + 1; m < rows.length; m++){
        var c = rows[m].stationShortCode;
        if (c === 'HKI' || c === 'PSL') { east = true; break; }
      }
      var last = rows.length ? rows[rows.length - 1].stationShortCode : '';
      out.push({
        line: String(tr.commuterLineID || tr.trainType || '').slice(0, 3),
        dest: STATION_NAMES[last] || last,
        east: east,
        ms: ms,            // best estimate (live if available)
        sched: sched,      // timetable time
        cancelled: !!(tr.cancelled || row.cancelled)
      });
    }
    out.sort(function(a, b){ return a.ms - b.ms; });
    return out;
  }

  var SOON_MIN = 15;   // departures sooner than this show as minutes

  // One departure row, shared by the train and bus boards.
  function depRow(kind, d, tag, split, group){
    var schedStr = fmtTime(new Date(d.sched));
    var estStr = fmtTime(new Date(d.ms));
    // Leaving within 15 min: minutes from the live estimate, like HSL's stop
    // displays ("4 min", "Nyt"). Later: timetable time, plus ~estimate if off.
    // Cancelled: the timetable time, struck through and dimmed (CSS).
    var mins = (d.ms - Date.now()) / 60000;
    var soon = !d.cancelled && mins < SOON_MIN;
    var timeHtml = !soon ? schedStr
      : (mins < 1 ? 'Nyt' : Math.floor(mins) + '<span class="dep__min">min</span>');
    var late = '<span class="dep__late">' + (!soon && !d.cancelled && estStr !== schedStr ? '~' + estStr : '') + '</span>';
    var line = String(d.line).replace(/[^A-Za-z0-9]/g, '');
    return '<div class="dep-row' + (d.cancelled ? ' is-cancelled' : '') + (split ? ' dep-row--split' : '') + '" data-g="' + (group || 0) + '">' +
      '<span class="dep__line dep__line--' + kind + (line.length > 3 ? ' dep__line--long' : '') + '">' + line + '</span>' +
      '<span class="dep__dest">' + String(d.dest).replace(/[<>&]/g, '') + '</span>' +
      '<span class="dep__when">' + (tag ? '<span class="dep__tag">' + tag + '</span>' : '') +
      '<span class="dep__time">' + timeHtml + '</span>' + late + '</span></div>';
  }

  function renderTrains(){
    var el = document.getElementById('trainList');
    var now = Date.now();
    if ((trainsOkAt && now - trainsOkAt > 10 * 60 * 1000) || (!trainsOkAt && trainsFailed)) {
      el.innerHTML = '<div class="board__empty">Junatietoja ei saatu · yritetään uudelleen</div>';
      return;
    }
    var dirs = [[], []];                     // [towards Helsinki, westbound]
    for (var i = 0; i < trainDepartures.length; i++){
      var d = trainDepartures[i];
      if (d.ms > now - 30 * 1000) dirs[d.east ? 0 : 1].push(d);
    }
    if (!dirs[0].length && !dirs[1].length) {
      el.innerHTML = '<div class="board__empty">' + (trainsOkAt ? 'Ei enää junia tänään' : 'Ladataan junia…') + '</div>';
      return;
    }
    var html = '';
    for (var g = 0; g < 2; g++){
      var items = dirs[g];
      for (var k = 0; k < items.length && k < TRAIN_ROWS[g]; k++){
        var it = items[k], prev = items[k - 1], next = items[k + 1];
        // "First": a long gap before it; "Last": the next train this way is only
        // after a long gap (labelled only when that next train is in the data).
        var gapBefore = prev ? it.sched - prev.sched : it.ms - now;
        var isFirst = gapBefore > NIGHT_GAP_MS;
        var isLast = !isFirst && !!next && (next.sched - it.sched > NIGHT_GAP_MS);
        html += depRow('train', it, isFirst ? 'Ens.' : isLast ? 'Viim.' : '', g === 1 && k === 0 && html !== '', g);
      }
    }
    el.innerHTML = html;
    fitBoard(el);
  }

  // Drop rows that don't fit (e.g. while a notice or lightning alert is
  // showing): always from the bottom of the longer direction, so both
  // directions stay visible and the first direction keeps the extra row.
  function fitBoard(el){
    var guard = 30;
    while (el.scrollHeight > el.clientHeight + 1 && guard-- > 0){
      var rows = el.querySelectorAll('.dep-row');
      if (rows.length <= 2) break;
      var last = [null, null], n = [0, 0];
      for (var i = 0; i < rows.length; i++){
        var g = rows[i].getAttribute('data-g') === '1' ? 1 : 0;
        last[g] = rows[i]; n[g]++;
      }
      var drop = n[1] >= n[0] ? last[1] : last[0];
      if (!drop) drop = last[0] || last[1];
      drop.parentNode.removeChild(drop);
    }
    if (el.querySelector('.dep__late:not(:empty)')) el.classList.add('has-late');
    else el.classList.remove('has-late');
  }
  // full redraw (rows can come back when there is room again)
  function renderDepartures(){
    if (typeof renderTrains === 'function') renderTrains();
    if (typeof renderBuses === 'function') renderBuses();
  }
  window.addEventListener('resize', function(){ renderDepartures(); });

  /* ---------- Station notices for Kilo (track works, replacement buses...) ---------- */
  // Fintraffic passenger information (RAMI). only_general=true: notices about the
  // station itself, not individual trains (those already show in the times).
  var NOTICE_URL = 'https://rata.digitraffic.fi/api/v1/passenger-information/active?station=' +
    TRAIN_STATION + '&only_general=true';
  var noticeTimer = null;

  function noticeText(msg){
    var parts = [msg.video, msg.audio], langs = ['fi', 'en'];
    for (var l = 0; l < langs.length; l++){
      for (var i = 0; i < parts.length; i++){
        var tx = parts[i] && parts[i].text;
        if (tx && tx[langs[l]]) return tx[langs[l]];
      }
    }
    return '';
  }

  function loadNotices(){
    var opts = sendUserHeader ? { headers: { 'Digitraffic-User': DIGITRAFFIC_USER } } : {};
    fetch(NOTICE_URL, opts).then(function(r){
      if (!r.ok) throw new Error('Digitraffic HTTP ' + r.status);
      return r.json();
    }).then(function(list){
      var now = Date.now(), texts = [];
      if (Array.isArray(list)){
        for (var i = 0; i < list.length; i++){
          var m = list[i];
          var start = Date.parse(m.startValidity), end = Date.parse(m.endValidity);
          if (!isNaN(start) && start > now) continue;
          if (!isNaN(end) && end < now) continue;
          var tx = noticeText(m).replace(/\s+/g, ' ').trim();
          if (tx && texts.indexOf(tx) < 0) texts.push(tx);
        }
      }
      var box = document.getElementById('trainNotice');
      if (!texts.length) { box.hidden = true; renderDepartures(); return; }
      var more = texts.length > 1 ? '<span class="train-notice__more">(+' + (texts.length - 1) + ' muuta)</span>' : '';
      document.getElementById('trainNoticeText').innerHTML =
        texts[0].replace(/[<>&]/g, '') + more;
      box.hidden = false;
      renderDepartures();
    }).catch(function(){ /* keep whatever is showing; try again next round */ })
      .then(function(){
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(loadNotices, 5 * 60 * 1000);
      });
  }

  function loadTrains(){
    fetchTrains().then(function(data){
      var arr = Array.isArray(data) ? data : [];
      trainDepartures = parseTrains(arr);
      trainsOkAt = Date.now();
      trainsFailed = false;
      renderTrains();
      scheduleTrains(30 * 1000);
    }).catch(function(){
      trainsFailed = true;
      renderTrains();                       // keep counting down the last known times
      scheduleTrains(60 * 1000);
    });
  }
  function scheduleTrains(ms){
    clearTimeout(trainsTimer);
    trainsTimer = setTimeout(loadTrains, ms);
  }

  loadTrains();
  loadNotices();
  setInterval(renderTrains, 15 * 1000);     // redraw between fetches (drops departed trains)

  /* ---------- Buses from Trillakatu, both directions (HSL Digitransit: needs a free API key) ---------- */
  // Get a key: https://portal-api.digitransit.fi -> sign up -> subscribe to the
  // API -> "Profile" -> "Show". Paste it between the quotes below.
  var HSL_API_KEY = '22b0d988bc2c4b8b88f0b25c8f7e8828';
  // Shown in this order: E1827 towards Leppävaara on top, E1826 towards Matinkylä below
  var BUS_STOP_CODES = ['E1827', 'E1826'];
  var BUS_STOP_NAME = 'Trillakatu';
  var BUS_ROWS = [5, 5];     // most rows: Leppävaara, Matinkylä; fewer if they don't fit
  var HSL_URL = 'https://api.digitransit.fi/routing/v2/hsl/gtfs/v1';
  // Search by stop name; the two sides of the street share the name and are
  // told apart by their codes.
  var BUS_QUERY = '{ stops(name: "' + BUS_STOP_NAME + '") { code ' +
    'alerts(types: [STOP, ROUTES]) { alertHeaderText effectiveStartDate effectiveEndDate } ' +
    'stoptimesWithoutPatterns(numberOfDepartures: 12) ' +
    '{ scheduledDeparture realtimeDeparture realtime realtimeState serviceDay headsign trip { route { shortName } } } } }';

  var busDepartures = [];     // [{ stop, line, dest, ms, sched, cancelled }]
  var busOkAt = 0;
  var busError = '';
  var busTimer = null;

  function loadBuses(){
    if (!HSL_API_KEY) { busError = 'nokey'; renderBuses(); return; }
    fetch(HSL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'digitransit-subscription-key': HSL_API_KEY, 'Accept-Language': 'fi' },
      body: JSON.stringify({ query: BUS_QUERY })
    }).then(function(r){
      if (r.status === 401 || r.status === 403) throw new Error('key');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(json){
      var stops = json && json.data && json.data.stops;
      if (!stops) throw new Error('data');
      var out = [], found = 0, alerts = [], nowS = Date.now() / 1000;
      for (var i = 0; i < stops.length; i++){
        var stop = stops[i];
        if (!stop || BUS_STOP_CODES.indexOf(stop.code) < 0) continue;
        found++;
        var al = stop.alerts || [];
        for (var a = 0; a < al.length; a++){
          var tx = String(al[a].alertHeaderText || '').replace(/\s+/g, ' ').trim();
          if (!tx || alerts.indexOf(tx) >= 0) continue;
          if (al[a].effectiveStartDate && al[a].effectiveStartDate > nowS) continue;
          if (al[a].effectiveEndDate && al[a].effectiveEndDate < nowS) continue;
          alerts.push(tx);
        }
        var times = stop.stoptimesWithoutPatterns || [];
        for (var j = 0; j < times.length; j++){
          var st = times[j];
          if (typeof st.serviceDay !== 'number' || typeof st.scheduledDeparture !== 'number') continue;
          // times are seconds since the start of the service day
          var sched = (st.serviceDay + st.scheduledDeparture) * 1000;
          var est = (st.realtime && typeof st.realtimeDeparture === 'number')
            ? (st.serviceDay + st.realtimeDeparture) * 1000 : sched;
          out.push({
            stop: stop.code,
            line: (st.trip && st.trip.route && st.trip.route.shortName) || '',
            dest: shortHeadsign(st.headsign || ''),
            ms: est,
            sched: sched,
            cancelled: st.realtimeState === 'CANCELED'
          });
        }
      }
      if (!found) throw new Error('nostop');
      out.sort(function(a, b){ return a.ms - b.ms; });
      busDepartures = out;
      showBusAlerts(alerts);
      busOkAt = Date.now();
      busError = '';
      renderBuses();
      scheduleBuses(30 * 1000);
    }).catch(function(err){
      var m = String(err && err.message);
      busError = (m === 'key' || m === 'nostop') ? m : 'fail';
      renderBuses();
      scheduleBuses(60 * 1000);
    });
  }
  // HSL notices for the stops and their lines (detours, works...), in Finnish
  var busAlertText = '';
  function showBusAlerts(list){
    var txt = list.length ? list[0].replace(/[<>&]/g, '') +
      (list.length > 1 ? '<span class="train-notice__more">(+' + (list.length - 1) + ' muuta)</span>' : '') : '';
    if (txt === busAlertText) return;
    busAlertText = txt;
    document.getElementById('busNoticeText').innerHTML = txt;
    document.getElementById('busNotice').hidden = !txt;
    renderDepartures();      // the notice takes room from the departures
  }

  // "Matinkylä (M) via Urheilupuisto (M)" -> "Matinkylä"
  function shortHeadsign(h){
    return h.replace(/\s+via\s+.*$/i, '').replace(/\s*\(M\)/g, '').trim();
  }

  function scheduleBuses(ms){
    clearTimeout(busTimer);
    busTimer = setTimeout(loadBuses, ms);
  }

  function renderBuses(){
    var el = document.getElementById('busList');
    var now = Date.now();
    var msg = '';
    if (busError === 'nokey') msg = 'HSL-avain puuttuu';
    else if (busError === 'key') msg = 'HSL-avain ei kelpaa';
    else if (busError === 'nostop') msg = 'Pysäkkejä ' + BUS_STOP_CODES.join(' / ') + ' ei löytynyt';
    else if ((busOkAt && now - busOkAt > 10 * 60 * 1000) || (!busOkAt && busError)) msg = 'Bussitietoja ei saatu · yritetään uudelleen';
    if (msg) { el.innerHTML = '<div class="board__empty">' + msg + '</div>'; return; }
    var html = '';
    var order = BUS_STOP_CODES;
    for (var s = 0; s < order.length; s++){
      var shown = 0;
      for (var i = 0; i < busDepartures.length && shown < BUS_ROWS[s]; i++){
        var d = busDepartures[i];
        if (d.stop !== order[s] || d.ms <= now - 30 * 1000) continue;
        html += depRow('bus', d, '', shown === 0 && html !== '', s);   // divider between directions
        shown++;
      }
    }
    el.innerHTML = html || '<div class="board__empty">' + (busOkAt ? 'Ei enää busseja tänään' : 'Ladataan busseja…') + '</div>';
    fitBoard(el);
  }

  loadBuses();
  setInterval(renderBuses, 15 * 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderDepartures);

  loadWeather(); // reschedules itself; also refreshes the FMI strips

  // Tablets pause timers while the screen is off. When the page becomes
  // visible again, refresh straight away if the data has gone stale.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastWeatherOkAt > 10 * 60 * 1000) loadWeather();
    loadTrains();
    loadNotices();
    loadBuses();
    loadLightning();
    loadPrices();
  });

  // amber dot on the weather panel when the weather hasn't updated for 30 min
  var pageStart = Date.now();
  function checkStale(){
    var now = Date.now();
    var stale = lastWeatherOkAt ? now - lastWeatherOkAt > 30 * 60 * 1000 : now - pageStart > 3 * 60 * 1000;
    document.getElementById('staleDot').hidden = !stale;
  }
  setInterval(checkStale, 60 * 1000);

  // Burn-in guard for the AMOLED screen: nudge the whole layout by a couple of
  // pixels every 3 minutes, walking round a small square. Not noticeable.
  var SHIFTS = [[0,0],[2,0],[2,2],[0,2],[-2,2],[-2,0],[-2,-2],[0,-2],[2,-2]], shiftIdx = 0;
  function pixelShift(){
    shiftIdx = (shiftIdx + 1) % SHIFTS.length;
    var dash = document.querySelector('.dash');
    if (dash) dash.style.transform = 'translate(' + SHIFTS[shiftIdx][0] + 'px,' + SHIFTS[shiftIdx][1] + 'px)';
  }
  setInterval(pixelShift, 3 * 60 * 1000);

  /* keep the day/night tint updating smoothly between fetches */
  setInterval(function(){
    if (lastSunrise && lastSunset) {
      updateSunArc(lastSunrise, lastSunset);
    }
  }, 60000);


  /* ================= Kani extras (fun bits, all in Finnish) =================
     - the bunny in the weather panel dresses for the weather and sleeps at night
     - tap the temperature or the bunny: the bunny says something
     - tap the clock 5 times in a row: carrot and bunny rain
     - tap the date 5 times in a row: a giant bunny bounces and trembles
     - hold the bunny for a second: version number
     - 06:30-09:30 and 14:30-17:30 the bunny gives a clothing tip by itself
     - seasonal outfits (December, Independence Day, Vappu, Midsummer, Halloween)
     - a snow pile along the weather panel after it has snowed
     - now and then (07-21) a bunny hops across the bottom of the screen
